name: site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache the mermaid browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install the mermaid browser
        run: npx puppeteer browsers install chrome
      - name: Test the pipeline
        run: npm test
      - name: Build the site
        run: npm run build -- --repo-url=${{ github.server_url }}/${{ github.repository_owner }}/starforge
        env:
          STARFORGE_DIAGRAMS: 1
      - name: Test the built site with diagrams
        run: npm run test:diagrams
      - name: Upload the site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 7

  deploy:
    name: deploy to Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
